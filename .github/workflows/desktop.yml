name: cloud-desktop

# An ephemeral Linux desktop that lives on GitHub Actions runners.
# Each session restores your home directory from an encrypted rclone
# remote on boot, runs for ~5.5h, snapshots periodically, does a final
# sync, then triggers the next session with your PAT so the chain never breaks.
#
# ---------------------------------------------------------------------------
# LATENCY / RESPONSIVENESS TUNING  (see TUNING.md for the rationale)
#   * APT .deb archives are cached between runners, so the ~4-6 min package
#     install collapses to seconds on a cache hit.
#   * The home restore runs IN PARALLEL with the package install, and rclone
#     is fetched as a static binary instead of through apt.
#   * xrdp is tuned for the lowest interactive latency: fastpath I/O,
#     TCP_NODELAY, bitmap cache + compression, RemoteFX preferred over H.264,
#     and short Xorg frame-capture intervals.
#   * XFCE compositing, animations and screen blanking are switched off.
#   * Backups run at idle CPU/IO priority so they never make the desktop stutter.
#   * The next runner is queued ~10 min before this one ends, so the handoff
#     gap loses its queue wait.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  schedule:
    # 04:00 IST (22:30 UTC) daily safety-net. If the PAT chain ever breaks,
    # this re-starts it.
    - cron: '30 22 * * *'

permissions:
  contents: read

concurrency:
  group: cloud-desktop
  # Never kill a live session because of an overlapping trigger.
  cancel-in-progress: false

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 345   # comfortably under GitHub's 6h (360m) hard cap
    env:
      SESSION_MINUTES: '330'
      SNAPSHOT_EVERY_MIN: '30'
      REMOTE: 'crypt1:home'          # rclone crypt remote (defined in RCLONE_CONFIG)
      TRASH_REMOTE: 'crypt1:trash'   # 7-day recoverable deletions
      TS_HOSTNAME: 'cloudpc'
      DEBIAN_FRONTEND: 'noninteractive'
    steps:
      - uses: actions/checkout@v4

      - name: Guard — cancel this run if another session is already active
        env:
          GH_TOKEN: ${{ secrets.RESTART_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RESTART_PAT secret not set — cannot check for duplicates"
            exit 0
          fi
          # gh run list includes this very run as in_progress.
          running=$(gh run list --workflow=desktop.yml --status in_progress --json databaseId --jq 'length' || echo 0)
          echo "In-progress runs (incl. self): $running"
          if [ "$running" -gt 1 ]; then
            echo "Another session is already active. Cancelling this duplicate."
            gh run cancel "$GITHUB_RUN_ID" --repo "$GH_REPO" || true
            sleep 15   # give GitHub time to process the cancellation
          fi

      # Reuse the downloaded .deb files from the previous runner. This is the
      # single biggest boot-time win: libreoffice + fonts + xfce4 are large.
      - name: Cache APT package archives
        uses: actions/cache@v4
        with:
          path: apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/desktop.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Enable KVM (the Android emulator needs it)
        run: |
          set -x
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "::warning::no /dev/kvm — the emulator will be painfully slow"

      - name: Create desktop user + session
        env:
          DESKTOP_PASSWORD: ${{ secrets.DESKTOP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$DESKTOP_PASSWORD" ]; then
            echo "::error::DESKTOP_PASSWORD secret not set"
            exit 1
          fi
          sudo useradd -m -s /bin/bash pc || true
          echo "pc:${DESKTOP_PASSWORD}" | sudo chpasswd
          sudo usermod -aG ssl-cert pc       # xrdp needs ssl-cert on Debian/Ubuntu
          sudo mkdir -p /run/xrdp /var/run/xrdp
          sudo mkdir -p /home/pc/.config
          sudo chown -R pc:pc /home/pc
          # NOTE: ~/.xsession is written LATER, after the home restore. The
          # restore brings back the backed-up copy of ~/.xsession and would
          # clobber anything written here.

      - name: Install desktop + restore home (in parallel)
        env:
          RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -uo pipefail

          # --- 1. Package install runs in the background -------------------
          (
            set -e
            export DEBIAN_FRONTEND=noninteractive
            mkdir -p apt-archives
            # Seed the apt cache from the restored cache dir, if any.
            sudo cp -a apt-archives/. /var/cache/apt/archives/ 2>/dev/null || true
            sudo apt-get update -qq
            # NOTE: do NOT pass --no-install-recommends here. The xfce4
            # metapackage brings its session components (xfce4-session, xfconf,
            # xfwm4, xfce4-panel, xfdesktop4) in via Recommends; skipping them
            # makes xfce4-session abort with "Unable to determine failsafe
            # session name" and you get a black screen with a Quit button.
            sudo apt-get install -y \
              xfce4 xfce4-session xfconf xfwm4 xfce4-panel xfdesktop4 xfce4-settings \
              xfce4-terminal thunar xclip xdg-utils \
              xrdp dbus-x11 xorgxrdp \
              libreoffice libreoffice-gtk3 \
              fonts-noto-cjk fonts-noto-color-emoji \
              policykit-1-gnome \
              rclone
            # Firefox via Mozilla's apt repo (avoid the snap stub on ubuntu-24.04).
            # (wget to a file first — piping to tee would mask a failed download.)
            sudo install -d -m 0755 /etc/apt/keyrings
            wget -qO /tmp/mozilla-key.gpg https://packages.mozilla.org/apt/repo-signing-key.gpg
            sudo cp /tmp/mozilla-key.gpg /etc/apt/keyrings/packages.mozilla.org.asc
            echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" \
              | sudo tee /etc/apt/sources.list.d/mozilla.list >/dev/null
            printf 'Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000\n' \
              | sudo tee /etc/apt/preferences.d/mozilla >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y firefox
            # Persist the freshly downloaded .debs for the next runner.
            cp -a /var/cache/apt/archives/*.deb apt-archives/ 2>/dev/null || true
          ) &
          APT_PID=$!

          # --- 2. Meanwhile, fetch rclone + restore /home/pc ----------------
          # Static binary: no apt round-trip, available immediately.
          if curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip \
             && python3 -c "import zipfile; zipfile.ZipFile('/tmp/rclone.zip').extractall('/tmp/rclone')" \
             && sudo install -m 0755 /tmp/rclone/rclone-*/rclone /usr/local/bin/rclone; then
            rclone version | head -1
          else
            echo "::warning::could not fetch static rclone — falling back to the apt package"
          fi

          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_SECRET" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if command -v rclone >/dev/null && rclone listremotes 2>/dev/null | grep -q '^crypt1:$'; then
            echo "Restoring /home/pc from $REMOTE ..."
            sudo RCLONE_CONFIG="$HOME/.config/rclone/rclone.conf" rclone copy "$REMOTE/" /home/pc \
              --transfers 16 --checkers 16 --fast-list \
              --stats 30s --stats-one-line \
              --exclude '.cache/**' \
              --exclude 'Cache/**' \
              --exclude '**/cache2/**' \
              --exclude '**/startupCache/**' \
              --exclude '**/shader-cache/**' \
              || echo "::warning::restore failed — continuing with empty home"
          else
            echo "::warning::RCLONE_CONFIG missing or has no 'crypt1' remote — starting with empty home"
          fi
          sudo chown -R pc:pc /home/pc

          # --- 3. Wait for the package install to finish -------------------
          wait "$APT_PID"

      - name: Write .xsession (AFTER the restore, which would clobber it)
        run: |
          set -euo pipefail
          # xrdp runs ~/.xsession on login. It MUST go through dbus-launch, or
          # xfce4-session aborts with "Unable to determine failsafe session
          # name". This runs AFTER the home restore on purpose: the restore
          # brings back the backed-up copy of ~/.xsession and would otherwise
          # overwrite this with a stale one.
          sudo tee /home/pc/.xsession >/dev/null <<'XSEOF'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          export XDG_CONFIG_DIRS=/etc/xdg
          xset s off -dpms 2>/dev/null || true
          exec dbus-launch --exit-with-session startxfce4
          XSEOF
          sudo chmod +x /home/pc/.xsession
          sudo chown pc:pc /home/pc/.xsession
          # A stale restored XFCE/xfconf config can also make the session abort.
          # Start from a clean session config every boot (this is a throwaway
          # desktop, so losing window settings costs nothing).
          sudo rm -rf /home/pc/.config/xfce4 /home/pc/.config/xfconf \
                      /home/pc/.cache/sessions 2>/dev/null || true

      - name: Claim the hostname (drop any older node with this name)
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
        run: |
          set -uo pipefail
          sudo apt-get install -y -qq jq >/dev/null 2>&1 || true
          if [ -z "${TS_API_KEY:-}" ]; then
            echo "::warning::TS_API_KEY not set — the name may get a -1 suffix"
            exit 0
          fi
          curl -fsS -H "Authorization: Bearer $TS_API_KEY" \
            "https://api.tailscale.com/api/v2/tailnet/-/devices" -o /tmp/devices.json || exit 0
          # Match the SHORT name EXACTLY (cloudpc or cloudpc-1), never a prefix:
          # a prefix match on "cloudpc" would also catch cloudpc-win,
          # cloudpc-emu and cloudpc-android and delete them.
          for id in $(jq -r --arg n "$TS_HOSTNAME" \
              '.devices[] | select((.name | split(".")[0]) | test("^" + $n + "(-[0-9]+)?$")) | .id' /tmp/devices.json); do
            echo "removing older node $id so $TS_HOSTNAME is free"
            curl -fsS -X DELETE -H "Authorization: Bearer $TS_API_KEY" \
              "https://api.tailscale.com/api/v2/device/$id" || echo "::warning::could not remove $id"
          done

      - name: Install the Android emulator + create an AVD
        run: |
          set -x
          # Runs inside the XFCE session (see .xsession) so it shows up over RDP —
          # the one transport that has been reliably smooth. KVM was enabled
          # above; without it this image is unusable, hence the x86_64 build.
          sudo apt-get install -y -qq openjdk-17-jdk-headless unzip >/dev/null || true
          sudo -u pc bash -c '
            set -e
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            cd "$HOME/android-sdk"
            curl -fsSL -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q -o cmdline.zip -d cmdline-tools
            rm -rf cmdline-tools/latest
            mv cmdline-tools/cmdline-tools cmdline-tools/latest
            export ANDROID_SDK_ROOT="$HOME/android-sdk"
            export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools"
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64" >/dev/null
            echo no | avdmanager create avd -n android -k "system-images;android-34;google_apis;x86_64" --device pixel_5 --force || true
          ' || echo "::warning::Android emulator setup failed — the desktop still works"

          sudo tee /home/pc/android-emu-launch.sh >/dev/null <<'EOF'
          #!/bin/sh
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator"
          sleep 3
          exec "$ANDROID_SDK_ROOT/emulator/emulator" -avd android \
            -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -skin 540x960
          EOF
          sudo chmod +x /home/pc/android-emu-launch.sh
          sudo chown pc:pc /home/pc/android-emu-launch.sh

          # Launch it via XFCE's OWN autostart mechanism. Do NOT touch .xsession:
          # injecting a background job there broke xfce4-session with
          # "Unable to determine failsafe session name".
          sudo mkdir -p /home/pc/.config/autostart
          sudo tee /home/pc/.config/autostart/android-emu.desktop >/dev/null <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Android Emulator
          Exec=/home/pc/android-emu-launch.sh
          Terminal=false
          X-GNOME-Autostart-enabled=true
          EOF
          sudo chown -R pc:pc /home/pc/.config/autostart

      - name: Bring up Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -euo pipefail
          if [ -z "$TS_AUTHKEY" ]; then
            echo "::warning::TS_AUTHKEY not set — desktop unreachable via tailnet"
            exit 0
          fi
          curl -fsSL https://tailscale.com/install.sh | sh
          # NOTE: 'ephemeral' is a property of the AUTH KEY (set when generating
          # it in the Tailscale admin console), NOT a CLI flag on `tailscale up`.
          sudo tailscale up --authkey="$TS_AUTHKEY" \
            --hostname="$TS_HOSTNAME" \
            --accept-routes
          TS_IP=$(tailscale ip -4 | head -1 || echo 'unknown')
          echo "::notice::Desktop ready at ${TS_IP} — RDP to ${TS_HOSTNAME}.<your-tailnet>.ts.net:3389 (MagicDNS)"

      - name: Tune xrdp + XFCE for lowest latency
        run: |
          set -euo pipefail

          # ---- 1. Prefer RemoteFX over H.264 --------------------------------
          # On a GPU-less runner RFX is noticeably snappier / lower-latency
          # for UI work than H.264. gfx.toml only exists on xrdp >= 0.10.
          if [ -f /etc/xrdp/gfx.toml ]; then
            sudo cp /etc/xrdp/gfx.toml /etc/xrdp/gfx.toml.orig
            if sudo grep -qE '^[[:space:]]*order[[:space:]]*=' /etc/xrdp/gfx.toml; then
              sudo sed -i -E 's|^[[:space:]]*order[[:space:]]*=.*|order = ["RFX", "H.264"]|' /etc/xrdp/gfx.toml
            else
              sudo sed -i '/^\[codec\]/a order = ["RFX", "H.264"]' /etc/xrdp/gfx.toml
            fi
            echo "gfx.toml: codec order set to RFX first"
          fi

          # ---- 2. xrdp.ini: latency-first globals + short frame intervals
          # (see scripts/tune-xrdp.py — line-based, section-confined, idempotent)
          sudo cp /etc/xrdp/xrdp.ini /etc/xrdp/xrdp.ini.orig
          sudo python3 "$GITHUB_WORKSPACE/scripts/tune-xrdp.py" /etc/xrdp/xrdp.ini

          # ---- 3. XFCE: no compositor, no animation, no blanking -----------
          sudo -u pc mkdir -p /home/pc/.config/xfce4/xfconf/xfce-perchannel-xml
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<channel name="xfwm4" version="1.0">' \
            '  <property name="general" type="empty">' \
            '    <property name="use_compositing" type="bool" value="false"/>' \
            '    <property name="box_move" type="bool" value="false"/>' \
            '    <property name="box_resize" type="bool" value="false"/>' \
            '    <property name="cycle_preview" type="bool" value="false"/>' \
            '  </property>' \
            '</channel>' \
            | sudo -u pc tee /home/pc/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml >/dev/null
          echo "xrdp + XFCE tuned for lowest latency."

      - name: Start xrdp + run session
        env:
          GH_TOKEN: ${{ secrets.RESTART_PAT }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          sudo systemctl enable --now xrdp 2>/dev/null || sudo service xrdp restart
          # Readiness check: verify xrdp is actually listening before proceeding.
          for i in $(seq 1 15); do
            if (ss -ltn 2>/dev/null | grep -q ':3389 '); then
              echo "xrdp is listening on :3389 (after ${i}s)"
              break
            fi
            sleep 1
          done
          if ! (ss -ltn 2>/dev/null | grep -q ':3389 '); then
            echo "::error::xrdp failed to start listening on :3389"
            sudo service xrdp status || true
            exit 1
          fi
          bash "$GITHUB_WORKSPACE/scripts/run-session.sh"

      - name: Final backup
        if: always()   # even on failure or cancellation — save what we can
        run: bash "$GITHUB_WORKSPACE/scripts/snapshot.sh" || true

      - name: Trigger next session (fallback if the session did not pre-queue one)
        if: '!cancelled()'
        env:
          GH_TOKEN: ${{ secrets.RESTART_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "No RESTART_PAT — chain stops here."; exit 0; fi
          # Don't add another run if one is already queued (the session step
          # pre-queues ~10 min before the end; the daily safety-net also queues).
          queued=$(gh run list --workflow=desktop.yml --status queued --json databaseId --jq 'length' || echo 0)
          if [ "$queued" -gt 0 ]; then
            echo "A run is already queued — not adding another."
            exit 0
          fi
          gh workflow run desktop.yml --repo "$GITHUB_REPOSITORY"
          echo "Next session queued."
