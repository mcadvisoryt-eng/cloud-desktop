name: android-desktop

# A real, full Android OS with Google Play, on a GitHub-hosted Ubuntu runner —
# FREE, no KVM, no emulator, no paid larger runner.
#
# How: redroid ("remote android") runs Android's userspace directly as a
# Docker container against the host kernel — not an emulator, so it needs no
# hardware virtualisation, only the `binder` kernel module (which the x86_64
# ubuntu-latest image ships).
#
# Google Play is added by baking GApps into the image with redroid-script.
# LiteGapps is used because MindTheGapps is arm64 and crashes on this x86_64
# host.
#
# Viewers (three run at once so if one fails the next may not):
#   :3200  stream-droid — scrcpy backend, high-fps H.264 via WebCodecs/MSE (try first)
#   :6080  noVNC      — VNC in the browser via scrcpy -> Xvfb -> x11vnc
#   :5900  raw VNC    — for a native VNC app (RealVNC Viewer, bVNC)
#
# See MOBILE.md for setup steps and troubleshooting.

on:
  workflow_dispatch:
  schedule:
    # 04:00 IST (22:30 UTC) daily safety-net.
    - cron: '30 22 * * *'

permissions:
  contents: read

concurrency:
  group: android-desktop
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 345   # under GitHub's 6h (360m) hard cap
    defaults:
      run:
        shell: bash
    env:
      ANDROID_VERSION: '13.0.0'
      TS_HOSTNAME: 'cloudpc-android'
      SESSION_MINUTES: '330'
      SNAPSHOT_EVERY_MIN: '30'
      REMOTE: 'crypt1:android'        # encrypted backup of the Android data dir
      TRASH_REMOTE: 'crypt1:trash'
      DATA_DIR: '/var/redroid-data'
      DEBIAN_FRONTEND: 'noninteractive'
      WEBSCREEN_PIN: '123456'          # 6-digit PIN for the webscreen WebRTC viewer
    steps:
      - uses: actions/checkout@v4

      - name: Cache APT package archives
        uses: actions/cache@v4
        with:
          path: apt-archives
          key: apt-android-v1
          restore-keys: |
            apt-android-

      - name: Install packages (with APT cache)
        run: |
          set -x
          mkdir -p apt-archives
          # Reuse .debs from previous runs so we don't re-download them.
          sudo cp -a apt-archives/. /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common || true
          sudo add-apt-repository -y universe || true
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq \
            "linux-modules-extra-$(uname -r)" \
            adb rclone git python3-venv python3-pip \
            xvfb x11vnc scrcpy novnc websockify tigervnc-standalone-server tigervnc-common \
            || echo "::warning::some packages failed to install"
          cp -a /var/cache/apt/archives/*.deb apt-archives/ 2>/dev/null || true
          echo "--- tools present? (MISSING means the install failed) ---"
          for b in adb rclone Xvnc scrcpy websockify; do command -v "$b" || echo "MISSING: $b"; done
          test -d /usr/share/novnc && echo "novnc web root: OK" || echo "MISSING: /usr/share/novnc"

      - name: Guard — cancel this run if another session is already active
        env:
          GH_TOKEN: ${{ secrets.RESTART_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RESTART_PAT secret not set — cannot check for duplicates"
            exit 0
          fi
          running=$(gh run list --workflow=android-desktop.yml --status in_progress --json databaseId --jq 'length' || echo 0)
          echo "In-progress runs (incl. self): $running"
          if [ "$running" -gt 1 ]; then
            echo "Another session is already active. Cancelling this duplicate."
            gh run cancel "$GITHUB_RUN_ID" --repo "$GH_REPO" || true
            sleep 15
          fi
          exit 0

      - name: Load the binder kernel modules (redroid needs these)
        run: |
          set -x
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || echo "::warning::modprobe binder_linux failed"
          sudo modprobe fuse || true
          # On kernel 6.x binder is a filesystem — the nodes only appear after
          # binderfs is mounted. This is the step most guides miss.
          if ! mountpoint -q /dev/binderfs; then
            sudo mkdir -p /dev/binderfs
            sudo mount -t binder binder /dev/binderfs || echo "::warning::binderfs mount failed"
          fi
          echo "--- diagnostics ---"
          echo "kernel: $(uname -r)"
          grep binder /proc/filesystems || echo "binder NOT in /proc/filesystems"
          ls -l /dev/binderfs 2>/dev/null || true
          lsmod | grep -E 'binder_linux|fuse' || true

      - name: Restore Android data from encrypted backup
        env:
          RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -uo pipefail
          sudo mkdir -p "$DATA_DIR"
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_SECRET" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          # The script restores only the subtrees that matter (data/app/system/…),
          # not the whole root — restoring everything made rclone enumerate the
          # entire encrypted tree and stall for tens of minutes. The `timeout` is
          # a hard cap so a slow remote can never hang the boot.
          timeout 600 bash "$GITHUB_WORKSPACE/scripts/android-restore.sh" \
            || echo "::warning::restore did not finish within 10 min — starting with whatever we have"

      - name: Build an Android image with Google Play (redroid-script)
        run: |
          set -x
          git clone --depth 1 https://github.com/ayasa520/redroid-script.git /tmp/redroid-script || true
          if [ -d /tmp/redroid-script ]; then
            cd /tmp/redroid-script
            python3 -m venv .venv
            . .venv/bin/activate
            pip install -q -r requirements.txt
            # -lg = LiteGapps (Play Store + Play Services), x86_64 builds.
            # -i  = houdini (run ARM apps on this x86_64 host)
            # -w  = Widevine L3 (DRM playback)
            # -m  = Magisk (root). NOTE: root fights integrity — apps that check
            # for root may refuse to run. Remove -m for max compatibility.
            python3 redroid.py -a "${ANDROID_VERSION}" -lg -i -w -m -c docker \
              || echo "::warning::GApps build failed — will fall back to plain AOSP redroid"
          fi
          sudo docker images --format '{{.Repository}}:{{.Tag}}' | head -20

      - name: Start Android
        run: |
          set -x
          IMG=$(sudo docker images --format '{{.Repository}}:{{.Tag}}' | grep -Ei 'litegapps|gapps|mindthegapps' | head -1)
          if [ -z "$IMG" ]; then
            IMG="redroid/redroid:${ANDROID_VERSION}-latest"
            sudo docker pull "$IMG" || true
          fi
          echo "using image: $IMG"
          sudo docker run -itd --rm --privileged --name android \
            -v "${DATA_DIR}:/data" \
            -p 5555:5555 \
            "$IMG" \
            androidboot.redroid_width=540 \
            androidboot.redroid_height=960 \
            androidboot.redroid_dpi=240 \
            androidboot.redroid_fps=60 \
            androidboot.redroid_gpu_mode=guest \
            androidboot.use_memfd=true \
            ro.setupwizard.mode=DISABLED \
            ro.product.cpu.abilist=x86_64,x86,arm64-v8a,armeabi-v7a,armeabi \
            ro.product.cpu.abilist64=x86_64,arm64-v8a \
            ro.product.cpu.abilist32=x86,armeabi-v7a,armeabi \
            ro.dalvik.vm.isa.arm=x86 \
            ro.dalvik.vm.isa.arm64=x86_64 \
            ro.enable.native.bridge.exec=1 \
            ro.vendor.enable.native.bridge.exec=1 \
            ro.vendor.enable.native.bridge.exec64=1 \
            ro.dalvik.vm.native.bridge=libhoudini.so
          sleep 5
          sudo docker ps -a
          echo "--- container log ---"
          sudo docker logs android 2>&1 | tail -40 || true

      - name: Wait for Android to finish booting
        run: |
          set -x
          adb start-server || true
          ok=0
          for i in $(seq 1 90); do
            adb connect localhost:5555 >/dev/null 2>&1 || true
            if adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$'; then
              echo "Android booted after ~$((i * 10))s"
              ok=1
              break
            fi
            sleep 10
          done
          adb devices || true
          adb -s localhost:5555 shell getprop ro.build.version.release || true
          # Keep the display awake — a sleeping screen shows as a black viewer.
          adb -s localhost:5555 shell svc power stayon true || true
          adb -s localhost:5555 shell settings put system screen_off_timeout 2147483647 || true
          adb -s localhost:5555 shell input keyevent KEYCODE_WAKEUP || true
          # Kill animations: less work per frame, so the stream feels snappier.
          adb -s localhost:5555 shell settings put global window_animation_scale 0 || true
          adb -s localhost:5555 shell settings put global transition_animation_scale 0 || true
          adb -s localhost:5555 shell settings put global animator_duration_scale 0 || true
          [ "$ok" = 1 ] || echo "::warning::Android did not report sys.boot_completed within 15 min — continuing anyway"

      - name: Certify the device with Google (Play Protect)
        run: |
          set -x
          adb connect localhost:5555 >/dev/null 2>&1 || true
          adb -s localhost:5555 root >/dev/null 2>&1 || true
          adb connect localhost:5555 >/dev/null 2>&1 || true
          sleep 3
          ID=$(adb -s localhost:5555 shell settings get secure android_id 2>/dev/null | tr -d '\r' | head -1)
          if [ -z "$ID" ]; then
            echo "::warning::could not read the Android ID — register it manually (see MOBILE.md)"
            exit 0
          fi
          echo "::notice::Android ID = $ID"
          curl -s -o /dev/null -w 'registration HTTP %{http_code}\n' \
            --data "id=$ID" "https://www.google.com/android/uncertified/" || true
          echo "If Play still says 'device not certified', open https://www.google.com/android/uncertified/ and submit: $ID"

      - name: Diagnostics — GApps state and crashes
        run: |
          set -x
          adb connect localhost:5555 >/dev/null 2>&1 || true
          echo "--- CPU abilist (want x86_64 first) ---"
          adb -s localhost:5555 shell getprop ro.product.cpu.abilist || true
          echo "--- Google packages present ---"
          adb -s localhost:5555 shell pm list packages 2>/dev/null | grep -iE 'gms|vending|gsf|setupwizard|gapps' || true
          echo "--- boot-time crash log ---"
          adb -s localhost:5555 logcat -d -b crash 2>/dev/null | tail -60 || true

      - name: Claim the hostname (drop any older node with this name)
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
        run: |
          set -uo pipefail
          # Tailscale suffixes a name when an older node still holds it, giving
          # cloudpc-android-1, -2, … and breaking the stable URL. Now that we
          # have API access we just remove any older node with our name first,
          # so we always join as the clean, predictable hostname.
          if [ -z "${TS_API_KEY:-}" ]; then
            echo "::warning::TS_API_KEY not set — skipping hostname claim (name may get a -1 suffix)"
            exit 0
          fi
          curl -fsS -H "Authorization: Bearer $TS_API_KEY" \
            "https://api.tailscale.com/api/v2/tailnet/-/devices" -o /tmp/devices.json || exit 0
          for id in $(jq -r --arg p "$TS_HOSTNAME" '.devices[] | select(.name | startswith($p)) | .id' /tmp/devices.json); do
            echo "removing older node $id so $TS_HOSTNAME is free"
            curl -fsS -X DELETE -H "Authorization: Bearer $TS_API_KEY" \
              "https://api.tailscale.com/api/v2/device/$id" || echo "::warning::could not remove $id"
          done

      - name: Bring up Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -euo pipefail
          if [ -z "$TS_AUTHKEY" ]; then
            echo "::warning::TS_AUTHKEY not set — Android unreachable via tailnet"
            exit 0
          fi
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TS_AUTHKEY" \
            --hostname="$TS_HOSTNAME" \
            --accept-routes
          TS_IP=$(tailscale ip -4 | head -1 || echo 'unknown')
          # Show the name Tailscale actually gave us. If stale nodes from dead
          # runs are still registered, we get renamed to cloudpc-android-1 and
          # the plain name resolves to a corpse. An EPHEMERAL auth key stops
          # that (see MOBILE.md).
          echo "--- tailscale status ---"
          tailscale status | head -5 || true
          echo "--- tailscale netcheck (direct vs DERP — see TUNNEL.md) ---"
          tailscale netcheck 2>/dev/null | head -25 || true
          echo "::notice::Android ready at ${TS_IP} — browser http://${TS_HOSTNAME}.<your-tailnet>.ts.net:3200/ , noVNC :6080/vnc.html , raw VNC :5900"

      - name: Install the browser viewer (stream-droid, scrcpy capture)
        run: |
          set -x
          # stream-droid drives scrcpy-server (native H.264, high fps) and renders
          # it in the browser via MSE/WebCodecs — no MJPEG screenshot fallback,
          # which is what capped the old serve-avd viewer at ~3 fps.
          npx -y stream-droid --help >/dev/null 2>&1 || echo "::warning::could not pre-fetch stream-droid"

      - name: Serve Android + run session
        env:
          GH_TOKEN: ${{ secrets.RESTART_PAT }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -x
          # --- Viewer #0: webscreen — WebRTC (lowest latency; see TUNNEL.md).
          # WebRTC does its own NAT traversal, uses UDP, and renders frames as
          # they arrive instead of buffering them for smoothness. ---
          WS_PIN="${WEBSCREEN_PIN:-123456}"
          if [ ! -x /tmp/webscreen ]; then
            curl -fsSL -o /tmp/webscreen \
              https://github.com/huonwe/webscreen/releases/latest/download/webscreen-linux-amd64 \
              && chmod +x /tmp/webscreen || echo "::warning::could not download webscreen"
          fi
          if [ -x /tmp/webscreen ]; then
            nohup /tmp/webscreen -host 0.0.0.0 -port 8079 -pin "$WS_PIN" >/tmp/webscreen.log 2>&1 &
            sleep 5
            echo "--- webscreen ---"; tail -10 /tmp/webscreen.log || true
            echo "::notice::webscreen (WebRTC) ready: http://${TS_HOSTNAME}.<your-tailnet>.ts.net:8079  PIN ${WS_PIN}"
          fi

          # --- Viewer #1: stream-droid with the scrcpy backend. scrcpy does the
          # H.264 encoding on the device and streams it natively, so this is the
          # high-frame-rate path (unlike serve-avd's screenrecord/MJPEG). ---
          nohup npx -y stream-droid localhost:5555 --capture scrcpy --headless --port 3200 >/tmp/stream-droid.log 2>&1 &
          sleep 15
          echo "--- stream-droid ---"; tail -20 /tmp/stream-droid.log || true
          echo "::notice::stream-droid viewer ready: http://${TS_HOSTNAME}.<your-tailnet>.ts.net:3200/"

          # --- Viewer #2: scrcpy -> Xvnc (TigerVNC) -> websockify -> noVNC.
          # Xvnc is ONE process that is both the X server and the VNC server, so
          # there is no Xvfb + x11vnc pair to fall out of sync (which is what
          # left a black screen before). ---
          export DISPLAY=:99
          Xvnc :99 -geometry 540x960 -depth 24 -SecurityTypes None -rfbport 5900 \
               -AlwaysShared -localhost no >/tmp/xvnc.log 2>&1 &
          sleep 3
          adb connect localhost:5555 >/dev/null 2>&1 || true
          scrcpy -s localhost:5555 --no-audio --max-size 540 --render-driver=software --window-title Android >/tmp/scrcpy.log 2>&1 &
          sleep 5
          websockify --web /usr/share/novnc 6080 localhost:5900 >/tmp/websockify.log 2>&1 &
          sleep 2
          for f in xvnc scrcpy websockify; do echo "--- $f ---"; tail -15 "/tmp/$f.log" || true; done
          echo "::notice::noVNC viewer ready: http://${TS_HOSTNAME}.<your-tailnet>.ts.net:6080/vnc.html (raw VNC on :5900)"

          start=$(date +%s); last_snap=$start; prequeued=0
          while true; do
            now=$(date +%s)
            elapsed=$(( (now - start) / 60 ))
            remaining=$(( SESSION_MINUTES - elapsed ))
            if [ "$remaining" -le 0 ]; then echo "Session time budget reached after ${elapsed}m."; break; fi

            if ! sudo docker ps --format '{{.Names}}' | grep -q '^android$'; then
              echo "::warning::android container is gone — stopping the session"; break
            fi

            if [ "$prequeued" -eq 0 ] && [ "$remaining" -le 10 ] && [ -n "${GH_TOKEN:-}" ] && [ -n "${GH_REPOSITORY:-}" ]; then
              if gh workflow run android-desktop.yml --repo "$GH_REPOSITORY" 2>/dev/null; then
                echo "Next session pre-queued (${remaining}m left)."; prequeued=1
              fi
            fi

            if [ $(( (now - last_snap) / 60 )) -ge "$SNAPSHOT_EVERY_MIN" ]; then
              echo "Periodic backup..."
              bash "$GITHUB_WORKSPACE/scripts/android-snapshot.sh" || echo "::warning::periodic backup failed"
              last_snap=$(date +%s)
            fi

            sleep 15
          done
          echo "Session loop complete."

      - name: Final backup
        if: always()   # even on failure or cancellation
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/android-snapshot.sh" || true

      - name: Trigger next session (fallback if the session did not pre-queue one)
        if: '!cancelled()'
        env:
          GH_TOKEN: ${{ secrets.RESTART_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "No RESTART_PAT — chain stops here."; exit 0; fi
          queued=$(gh run list --workflow=android-desktop.yml --status queued --json databaseId --jq 'length' || echo 0)
          if [ "$queued" -gt 0 ]; then
            echo "A run is already queued — not adding another."
            exit 0
          fi
          gh workflow run android-desktop.yml --repo "$GITHUB_REPOSITORY"
          echo "Next session queued."
