name: android-desktop

# A real, full Android OS on a GitHub-hosted Ubuntu runner — FREE, no KVM,
# no emulator, no paid larger runner.
#
# How: redroid ("remote android") runs Android's userspace directly as a
# Docker container against the host kernel. It is NOT an emulator, so it needs
# no hardware virtualisation — only the `binder` kernel module, which the
# x86_64 ubuntu-latest runner image ships.
#
# You view and control it from your phone's browser via ws-scrcpy (a
# browser-based scrcpy client), over Tailscale.
#
# See MOBILE.md for the full picture and troubleshooting.

on:
  workflow_dispatch:
  schedule:
    # 04:00 IST (22:30 UTC) daily safety-net.
    - cron: '30 22 * * *'

permissions:
  contents: read

concurrency:
  group: android-desktop
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 345   # under GitHub's 6h (360m) hard cap
    env:
      ANDROID_IMAGE: 'redroid/redroid:13.0.0-latest'
      TS_HOSTNAME: 'cloudpc-android'
      SESSION_MINUTES: '330'
      WEB_PORT: '8000'
    steps:
      - uses: actions/checkout@v4

      - name: Guard — cancel this run if another session is already active
        env:
          GH_TOKEN: ${{ secrets.RESTART_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RESTART_PAT secret not set — cannot check for duplicates"
            exit 0
          fi
          running=$(gh run list --workflow=android-desktop.yml --status in_progress --json databaseId --jq 'length' || echo 0)
          echo "In-progress runs (incl. self): $running"
          if [ "$running" -gt 1 ]; then
            echo "Another session is already active. Cancelling this duplicate."
            gh run cancel "$GITHUB_RUN_ID" --repo "$GH_REPO" || true
            sleep 15
          fi

      - name: Load the binder kernel modules (redroid needs these)
        run: |
          set -x
          sudo apt-get update -qq
          # binder_linux lives in linux-modules-extra on the runner's kernel.
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" adb || true
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || echo "::warning::modprobe binder_linux failed"
          sudo modprobe fuse || true
          # On kernel 6.x binder is a filesystem — the device nodes only appear
          # after binderfs is mounted. This is the step most guides miss.
          if ! mountpoint -q /dev/binderfs; then
            sudo mkdir -p /dev/binderfs
            sudo mount -t binder binder /dev/binderfs || echo "::warning::binderfs mount failed"
          fi
          echo "--- diagnostics ---"
          echo "kernel: $(uname -r)"
          grep binder /proc/filesystems || echo "binder NOT in /proc/filesystems"
          ls -l /dev/binderfs 2>/dev/null || true
          lsmod | grep -E 'binder_linux|fuse' || true

      - name: Start Android (redroid container)
        run: |
          set -x
          sudo mkdir -p /var/redroid-data
          sudo docker run -itd --rm --privileged --name android \
            -v /var/redroid-data:/data \
            -p 5555:5555 \
            "$ANDROID_IMAGE" \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=320 \
            androidboot.redroid_gpu_mode=guest \
            androidboot.use_memfd=true
          sleep 5
          sudo docker ps -a
          echo "--- container log ---"
          sudo docker logs android 2>&1 | tail -40 || true

      - name: Wait for Android to finish booting
        run: |
          set -x
          adb start-server || true
          ok=0
          for i in $(seq 1 60); do
            adb connect localhost:5555 >/dev/null 2>&1 || true
            if adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$'; then
              echo "Android booted after ~$((i * 10))s"
              ok=1
              break
            fi
            sleep 10
          done
          adb devices || true
          if [ "$ok" != 1 ]; then
            echo "::warning::Android did not report sys.boot_completed within 10 min — continuing anyway"
          fi

      - name: Bring up Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -euo pipefail
          if [ -z "$TS_AUTHKEY" ]; then
            echo "::warning::TS_AUTHKEY not set — Android unreachable via tailnet"
            exit 0
          fi
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TS_AUTHKEY" \
            --hostname="$TS_HOSTNAME" \
            --accept-routes
          TS_IP=$(tailscale ip -4 | head -1 || echo 'unknown')
          echo "::notice::Android ready at ${TS_IP} — open http://${TS_HOSTNAME}.<your-tailnet>.ts.net:${WEB_PORT} on your phone"

      - name: Install the web viewer (ws-scrcpy)
        run: |
          set -x
          sudo apt-get install -y -qq git
          # Browser-based scrcpy client — works with redroid; touch + keyboard.
          git clone --depth 1 https://github.com/NetrisTV/ws-scrcpy.git /tmp/ws-scrcpy || true
          if [ -d /tmp/ws-scrcpy ]; then
            cd /tmp/ws-scrcpy
            npm install || echo "::warning::npm install failed"
            npm run dist || echo "::warning::client build failed"
          else
            echo "::warning::could not clone ws-scrcpy"
          fi

      - name: Serve Android + run session
        env:
          GH_TOKEN: ${{ secrets.RESTART_PAT }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -x
          # Start the browser viewer in the background (survives this step).
          if [ -d /tmp/ws-scrcpy ]; then
            cd /tmp/ws-scrcpy
            nohup npm start > /tmp/ws-scrcpy.log 2>&1 &
            sleep 8
            echo "--- ws-scrcpy log ---"
            tail -20 /tmp/ws-scrcpy.log || true
          fi

          start=$(date +%s)
          prequeued=0
          while true; do
            now=$(date +%s)
            elapsed=$(( (now - start) / 60 ))
            remaining=$(( SESSION_MINUTES - elapsed ))
            if [ "$remaining" -le 0 ]; then
              echo "Session time budget reached after ${elapsed}m."
              break
            fi
            # Keep the Android container alive.
            if ! sudo docker ps --format '{{.Names}}' | grep -q '^android$'; then
              echo "::warning::android container is gone — stopping the session"
              break
            fi
            # Pre-queue the next runner shortly before the end.
            if [ "$prequeued" -eq 0 ] && [ "$remaining" -le 10 ] && [ -n "${GH_TOKEN:-}" ] && [ -n "${GH_REPOSITORY:-}" ]; then
              if gh workflow run android-desktop.yml --repo "$GH_REPOSITORY" 2>/dev/null; then
                echo "Next session pre-queued (${remaining}m left)."
                prequeued=1
              fi
            fi
            sleep 15
          done
          echo "Session loop complete."

      - name: Trigger next session (fallback if the session did not pre-queue one)
        if: '!cancelled()'
        env:
          GH_TOKEN: ${{ secrets.RESTART_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "No RESTART_PAT — chain stops here."; exit 0; fi
          queued=$(gh run list --workflow=android-desktop.yml --status queued --json databaseId --jq 'length' || echo 0)
          if [ "$queued" -gt 0 ]; then
            echo "A run is already queued — not adding another."
            exit 0
          fi
          gh workflow run android-desktop.yml --repo "$GITHUB_REPOSITORY"
          echo "Next session queued."
