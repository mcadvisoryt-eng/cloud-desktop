name: kvm-probe

# Does a standard (free) ubuntu-latest runner actually expose /dev/kvm?
# That single fact decides whether the official Android Emulator is viable here
# (it needs KVM) or whether redroid — which needs no virtualisation — is the
# right choice. The udev rule people paste only changes permissions on
# /dev/kvm; it cannot create the device.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe KVM support
        run: |
          set -x
          echo "=== /dev/kvm ==="
          ls -l /dev/kvm || echo "NO /dev/kvm device"
          echo "=== CPU virtualisation flags (vmx = Intel, svm = AMD) ==="
          grep -m1 -oE 'vmx|svm' /proc/cpuinfo || echo "no vmx/svm in /proc/cpuinfo"
          echo "=== kvm kernel modules ==="
          lsmod | grep -i kvm || echo "no kvm modules loaded"
          echo "=== nested virtualisation setting ==="
          cat /sys/module/kvm_intel/parameters/nested 2>/dev/null || echo "no kvm_intel nested param"
          cat /sys/module/kvm_amd/parameters/nested 2>/dev/null || echo "no kvm_amd nested param"
          echo "=== can we open it? ==="
          sudo chmod 666 /dev/kvm 2>/dev/null && echo "chmod ok" || echo "chmod failed (device missing?)"
          echo "=== docker available? (for redroid) ==="
          docker version --format '{{.Server.Version}}' 2>/dev/null || echo "no docker"
          echo "=== binder module present? (for redroid) ==="
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>/dev/null && echo "binder_linux OK" || echo "binder_linux failed"
          grep binder /proc/filesystems || true
