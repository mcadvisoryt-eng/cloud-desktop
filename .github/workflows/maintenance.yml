name: maintenance

# Tailnet housekeeping — because dead runners pile up as `cloudpc-android`,
# `cloudpc-android-1`, `cloudpc-win-2`, … and then the plain name resolves to a
# corpse.
#
# Requires a Tailscale **API access token** (NOT the auth key — that only joins
# nodes). Create one: Tailscale admin console -> Settings -> Keys ->
# "Generate access token", then:
#     gh secret set TS_API_KEY --repo <owner>/<repo>
#
# Run it with action=list to just look, or action=clean-stale to delete every
# offline device whose name starts with the prefix. Online devices are never
# touched, so a live desktop can't be removed by accident.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'list = show devices; clean-stale = delete offline ones; kvm = probe runner; backup = check encrypted snapshots'
        required: true
        default: 'list'
        type: choice
        options:
          - list
          - clean-stale
          - kvm
          - backup
      name_prefix:
        description: 'Only devices whose name starts with this are considered for deletion'
        required: false
        default: 'cloudpc'

permissions:
  contents: read

jobs:
  tailnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the API key is present
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TS_API_KEY:-}" ]; then
            echo "::error::TS_API_KEY is not set. This is a Tailscale API access token (admin console -> Settings -> Keys -> Generate access token), NOT the auth key. Add it with: gh secret set TS_API_KEY"
            exit 1
          fi
          echo "TS_API_KEY is present."

      - name: List tailnet devices
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $TS_API_KEY" \
            "https://api.tailscale.com/api/v2/tailnet/-/devices" -o /tmp/devices.json
          echo "--- name | id | lastSeen | state ---"
          jq -r '.devices[] | [.name, .id, (.lastSeen // "-"), (if .connectedToControl then "ONLINE" else "offline" end)] | @tsv' \
            /tmp/devices.json | column -t -s $'\t' || cat /tmp/devices.json

      - name: Probe KVM / virtualisation support (decides emulator vs redroid)
        if: ${{ github.event.inputs.action == 'kvm' }}
        run: |
          set -x
          echo "=== /dev/kvm ==="
          ls -l /dev/kvm || echo "NO /dev/kvm device"
          echo "=== CPU virtualisation flags (vmx = Intel, svm = AMD) ==="
          grep -m1 -oE 'vmx|svm' /proc/cpuinfo || echo "no vmx/svm in /proc/cpuinfo"
          echo "=== kvm kernel modules ==="
          lsmod | grep -i kvm || echo "no kvm modules loaded"
          echo "=== nested virtualisation setting ==="
          cat /sys/module/kvm_intel/parameters/nested 2>/dev/null || echo "no kvm_intel nested param"
          cat /sys/module/kvm_amd/parameters/nested 2>/dev/null || echo "no kvm_amd nested param"
          echo "=== binder module present? (redroid needs this) ==="
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>/dev/null && echo "binder_linux OK" || echo "binder_linux failed"
          grep binder /proc/filesystems || true

      - name: Install rclone (needed for the backup check)
        if: ${{ github.event.inputs.action == 'backup' }}
        run: |
          set -x
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone \
            || curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version | head -1

      - name: Check backups (are the encrypted snapshots landing?)
        if: ${{ github.event.inputs.action == 'backup' }}
        env:
          RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -uo pipefail
          if [ -z "${RCLONE_CONFIG_SECRET:-}" ]; then
            echo "::error::RCLONE_CONFIG secret not set — cannot check backups"; exit 1
          fi
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_SECRET" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          echo "--- remotes ---"; rclone listremotes || true
          echo
          echo "--- recent backup stamps (crypt1:trash/<stamp> = a sync that changed files) ---"
          timeout 120 rclone lsf --max-depth 1 crypt1:trash 2>/dev/null | sort | tail -8 || echo "(none)"
          echo
          echo "--- failure logs (crypt1:logs — only written when something FAILED) ---"
          timeout 120 rclone lsf --max-depth 1 crypt1:logs 2>/dev/null | sort | tail -8 || echo "(none — good)"
          echo
          echo "--- sizes ---"
          for r in crypt1:home crypt1:winhome crypt1:android; do
            echo -n "$r: "
            timeout 150 rclone size "$r" 2>/dev/null || echo "(could not size — or it timed out)"
          done

      - name: Clean stale (offline) devices
        if: ${{ github.event.inputs.action == 'clean-stale' }}
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
          PREFIX: ${{ github.event.inputs.name_prefix }}
        run: |
          set -euo pipefail
          PREFIX="${PREFIX:-cloudpc}"
          curl -fsS -H "Authorization: Bearer $TS_API_KEY" \
            "https://api.tailscale.com/api/v2/tailnet/-/devices" -o /tmp/devices.json

          # Every offline device whose name starts with the prefix. Online ones
          # (a live desktop) are deliberately left alone.
          mapfile -t ROWS < <(jq -r --arg p "$PREFIX" \
            '.devices[] | select((.name | startswith($p)) and (.connectedToControl == false)) | "\(.id)\t\(.name)"' \
            /tmp/devices.json)

          if [ "${#ROWS[@]}" -eq 0 ]; then
            echo "Nothing stale to remove (no offline '${PREFIX}*' devices)."
            exit 0
          fi

          for row in "${ROWS[@]}"; do
            id="${row%%$'\t'*}"; name="${row##*$'\t'}"
            echo "deleting stale device: ${name} (${id})"
            curl -fsS -X DELETE -H "Authorization: Bearer $TS_API_KEY" \
              "https://api.tailscale.com/api/v2/device/${id}" \
              && echo "  removed ${name}" \
              || echo "::warning::could not remove ${name} (${id})"
          done

          echo "--- devices after cleanup ---"
          curl -fsS -H "Authorization: Bearer $TS_API_KEY" \
            "https://api.tailscale.com/api/v2/tailnet/-/devices" \
            | jq -r '.devices[] | [.name, (if .connectedToControl then "ONLINE" else "offline" end)] | @tsv' \
            | column -t -s $'\t' || true
