name: windows-desktop

# A licensed Windows desktop on a GitHub-hosted Windows runner.
# Reached over RDP through Tailscale, with the user profile backed up to the
# same encrypted rclone remote as the Linux variant.
#
# No nested VM, no downloaded ISO, no activation step: windows-latest is
# already a licensed, activated Windows Server image provided by GitHub.
#
# NOTE: RDP uses a DEDICATED user (`pc`), NOT `runneradmin`. Logging in as the
# account the runner itself uses can disturb the runner session and kill the
# job — so we leave runneradmin alone entirely.
#
# ---------------------------------------------------------------------------
# LATENCY — read WINDOWS.md before expecting numbers.
# RDP latency is dominated by the distance to the runner's Azure region, which
# you cannot choose on a standard runner. Everything here removes the latency
# that IS under our control (transport, crypto, encoding, desktop effects).
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  schedule:
    # 04:00 IST (22:30 UTC) daily safety-net.
    - cron: '30 22 * * *'

permissions:
  contents: read

concurrency:
  group: windows-desktop
  cancel-in-progress: false

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 345   # under GitHub's 6h (360m) hard cap
    defaults:
      run:
        shell: pwsh
    env:
      SESSION_MINUTES: '330'
      SNAPSHOT_EVERY_MIN: '30'
      REMOTE: 'crypt1:winhome'        # encrypted remote for the Windows profile
      TRASH_REMOTE: 'crypt1:trash'
      TS_HOSTNAME: 'cloudpc-win'
      RDP_USER: 'pc'                  # dedicated RDP user (not runneradmin)
    steps:
      - uses: actions/checkout@v4

      - name: Guard — cancel this run if another session is already active
        env:
          GH_TOKEN: ${{ secrets.RESTART_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          if (-not $env:GH_TOKEN) {
            Write-Host "::warning::RESTART_PAT secret not set — cannot check for duplicates"
            exit 0
          }
          # Keep the NEWEST session and clear OLDER duplicates. This used to
          # cancel ITSELF, so a fresh run died whenever a stale one was still
          # winding down — that is how a live desktop disappeared.
          $me = [long]$env:GITHUB_RUN_ID
          $ids = gh run list --workflow=windows-desktop.yml --status in_progress --json databaseId --jq '.[].databaseId' 2>$null
          foreach ($id in $ids) {
            $n = [long]$id
            if ($n -lt $me) {
              Write-Host "cancelling older duplicate $n (keeping $me)"
              gh run cancel $n --repo $env:GH_REPO 2>$null
            } elseif ($n -gt $me) {
              Write-Host "a newer run ($n) exists - this one stands down"
              gh run cancel $me --repo $env:GH_REPO 2>$null
              break
            }
          }
          exit 0

      - name: Enable RDP + create the desktop user
        env:
          DESKTOP_PASSWORD: ${{ secrets.DESKTOP_PASSWORD }}
        run: |
          if (-not $env:DESKTOP_PASSWORD) {
            Write-Host "::error::DESKTOP_PASSWORD secret not set"
            exit 1
          }
          # Turn on Remote Desktop and open the firewall rule (the tailnet is
          # the only network that can reach it anyway).
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1 -Force
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          # This box is reachable only over Tailscale, so relax the local
          # password policy first — that way whatever password you chose is
          # accepted instead of tripping Windows' complexity rules.
          # Best-effort: if it fails we still try to set the password below.
          try {
            $inf = "$env:TEMP\pwpol.inf"; $sdb = "$env:TEMP\pwpol.sdb"
            secedit /export /cfg $inf | Out-Null
            (Get-Content $inf -Encoding Unicode) `
              -replace 'PasswordComplexity\s*=\s*1', 'PasswordComplexity = 0' `
              -replace 'MinimumPasswordLength\s*=\s*\d+', 'MinimumPasswordLength = 0' |
              Set-Content $inf -Encoding Unicode
            secedit /configure /db $sdb /cfg $inf /areas SECURITYPOLICY | Out-Null
          } catch {
            Write-Host "::warning::could not relax the password policy"
          }

          # A DEDICATED user for RDP. We deliberately do NOT reuse runneradmin:
          # logging in as the account the runner itself runs as can disturb the
          # runner session. This account is separate, so your logon cannot.
          $u = $env:RDP_USER
          $pw = ConvertTo-SecureString -AsPlainText $env:DESKTOP_PASSWORD -Force
          try {
            if (Get-LocalUser -Name $u -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name $u -Password $pw
            } else {
              New-LocalUser -Name $u -Password $pw -PasswordNeverExpires -AccountNeverExpires | Out-Null
            }
          } catch {
            Write-Host "::error::Could not create/set the RDP user. Windows wants 8+ characters with upper case, lower case and a digit. Update the DESKTOP_PASSWORD secret and re-run."
            exit 1
          }
          Add-LocalGroupMember -Group 'Administrators' -Member $u -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $u -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "C:\Users\$u" | Out-Null

          # Make sure the listener is up — but do NOT forcibly restart the
          # service (that logs off sessions) unless nothing is listening.
          if (-not (Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue)) {
            Restart-Service -Name TermService -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 3
          Write-Host "RDP enabled for user $u."
          exit 0

      - name: Tune RDP + desktop for lowest latency
        run: |
          & "$env:GITHUB_WORKSPACE/scripts/tune-rdp.ps1"
          exit 0

      - name: Set up app installers (winget + Chocolatey)
        run: |
          # windows-latest is Windows Server, which ships WITHOUT the Microsoft
          # Store — Server editions never included it, and adding it is
          # unsupported. The practical equivalents are winget (the Windows
          # Package Manager) and Chocolatey. Use those to install apps.
          Write-Host "--- winget ---"
          try {
            winget --version
          } catch {
            Write-Host "::warning::winget not found; trying to register App Installer"
            try { Add-AppxPackage -RegisterByFamilyName -MainPackage Microsoft.DesktopAppInstaller_8wekyb3d8bbwe } catch { Write-Host "::warning::could not enable winget" }
          }
          Write-Host "--- Chocolatey ---"
          if (Get-Command choco -ErrorAction SilentlyContinue) {
            choco --version
          } else {
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = 3072
            Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
            choco --version
          }
          Write-Host "--- how to install apps ---"
          Write-Host "  winget install <Id>        e.g. winget install Mozilla.Firefox"
          Write-Host "  choco install <name> -y    e.g. choco install vlc -y"
          Write-Host "  Store-only .msix can be sideloaded: Add-AppxPackage -Path <file>.msix"
          exit 0

      - name: Customise the desktop (IST clock, smoothness, theme, apps)
        run: |
          # --- clock: IST ---------------------------------------------------
          try {
            Set-TimeZone -Id 'India Standard Time'
            Write-Host "timezone: $((Get-TimeZone).DisplayName)"
          } catch { Write-Host "::warning::could not set the timezone" }

          # --- smoothness: the Server annoyances that make it feel wrong ----
          # IE Enhanced Security Configuration blocks ordinary browsing.
          foreach ($guid in '{A509B1A7-37EF-4b3f-8CFC-4F3A74704073}','{A509B1A8-37EF-4b3f-8CFC-4F3A74704073}') {
            try {
              $k = "HKLM:\SOFTWARE\Microsoft\Active Setup\Installed Components\$guid"
              if (Test-Path $k) { Set-ItemProperty -Path $k -Name IsInstalled -Value 0 -Force }
            } catch {}
          }
          # Stop Server Manager opening at every logon.
          try { New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\ServerManager' -Name DoNotOpenServerManagerAtLogon -PropertyType DWord -Value 1 -Force | Out-Null } catch {}
          # Telemetry services off (smoothness, not security).
          foreach ($svc in 'DiagTrack','dmwappushservice') {
            try { Stop-Service $svc -Force -ErrorAction SilentlyContinue; Set-Service $svc -StartupType Disabled -ErrorAction SilentlyContinue } catch {}
          }
          # Hibernation file off -> less disk churn.
          try { powercfg /hibernate off } catch {}

          # --- aesthetic: wallpaper (generated, so no licensing question) ---
          $wp = 'C:\Users\Public\wallpaper.png'
          try {
            Add-Type -AssemblyName System.Drawing
            $bmp = New-Object System.Drawing.Bitmap(1920,1080)
            $g   = [System.Drawing.Graphics]::FromImage($bmp)
            $rect = New-Object System.Drawing.Rectangle(0,0,1920,1080)
            $br = New-Object System.Drawing.Drawing2D.LinearGradientBrush($rect, `
                    [System.Drawing.Color]::FromArgb(18,10,36), [System.Drawing.Color]::FromArgb(6,54,70), 45)
            $g.FillRectangle($br, $rect)
            for ($i=0; $i -lt 3; $i++) {
              $b2 = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(30-($i*9), 150, 120, 255))
              $d  = 560 - ($i*130)
              $g.FillEllipse($b2, 1150-($i*70), 100+($i*150), $d, $d)
            }
            $bmp.Save($wp, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Write-Host "wallpaper: $wp"
          } catch { Write-Host "::warning::wallpaper generation failed" }

          # Apply dark theme + wallpaper to the DEFAULT profile, so the 'pc'
          # account inherits it on first logon (HKCU here would be the runner's).
          try {
            reg load 'HKU\DefaultUser' 'C:\Users\Default\NTUSER.DAT' | Out-Null
            $p = 'HKU:\DefaultUser\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
            New-Item -Force -Path $p | Out-Null
            Set-ItemProperty -Path $p -Name AppsUseLightTheme   -Value 0 -Type DWord -Force
            Set-ItemProperty -Path $p -Name SystemUsesLightTheme -Value 0 -Type DWord -Force
            $d = 'HKU:\DefaultUser\Control Panel\Desktop'
            Set-ItemProperty -Path $d -Name Wallpaper      -Value $wp   -Force
            Set-ItemProperty -Path $d -Name WallpaperStyle -Value '10'  -Force
            Set-ItemProperty -Path $d -Name TileWallpaper  -Value '0'   -Force
            reg unload 'HKU\DefaultUser' | Out-Null
            Write-Host "dark theme + wallpaper applied to the default profile"
          } catch { Write-Host "::warning::could not theme the default profile" }

          # --- winutil's Standard preset: an unattended, curated debloat ----
          # Borrowed from ChrisTitusTech/winutil (MIT). Best-effort: it targets
          # Windows 10/11, so on Server a few items are no-ops.
          try {
            Write-Host "applying the winutil Standard preset ..."
            & ([ScriptBlock]::Create((irm https://christitus.com/win))) -Preset Standard
          } catch { Write-Host "::warning::winutil preset did not complete (expected on Server)" }

          # --- a real Start menu, and apps worth having ---------------------
          foreach ($pkg in 'open-shell','7zip','notepadplusplus','vlc','discord','spotify') {
            try {
              Write-Host "installing $pkg ..."
              choco install $pkg -y --no-progress --limit-output 2>&1 | Select-Object -Last 2 | Out-Host
            } catch { Write-Host "::warning::could not install $pkg" }
          }
          exit 0

      - name: Install Chrome + force-install the Proton VPN extension
        run: |
          # Chrome is not on the Server image by default.
          $chrome = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path $chrome)) {
            Write-Host "Installing Google Chrome via Chocolatey..."
            choco install googlechrome -y --no-progress 2>&1 | Out-Host
          }
          if (Test-Path $chrome) {
            Write-Host "Chrome present: $((Get-Item $chrome).VersionInfo.ProductVersion)"
          } else {
            Write-Host "::warning::Chrome not found after install"
          }

          # Force-install the official Proton VPN extension (Proton AG, id
          # jplgfhpmjnbigmhklmmbgecoobifkmpa). Policy-based install means no
          # clicking, and it applies to every profile. Proton VPN is a Chrome
          # Web Store extension, so this works even though the runner is not
          # domain-joined.
          #
          # Signing in to Proton is a one-time manual step: that sign-in is
          # stored in the Chrome profile, which crypt1:winhome backs up and
          # restores, so it survives across sessions.
          # Daily-driver extensions, force-installed by policy. Their settings
          # and sign-ins live in the Chrome profile, which crypt1:chrome backs
          # up and restores, so they survive the session handover.
          $exts = @(
            'jplgfhpmjnbigmhklmmbgecoobifkmpa',  # Proton VPN (Proton AG)
            'cjpalhdlnbpafiamejdnhcphjbkeiagm',  # uBlock Origin (Raymond Hill)
            'nngceckbapebfimnlniiiahkandclblb',  # Bitwarden Password Manager
            'eimadpbcbfnmbkopoojfekhnkhdbieeh',  # Dark Reader
            'mnjggcdmjocbbbhaepdhchncahnbgone'   # SponsorBlock for YouTube
          )
          $key = 'HKLM:\SOFTWARE\Policies\Google\Chrome\ExtensionInstallForcelist'
          New-Item -Force -Path $key | Out-Null
          # Rewrite the list from scratch so it is exactly the set above.
          Get-Item $key | Select-Object -ExpandProperty Property -ErrorAction SilentlyContinue |
            ForEach-Object { Remove-ItemProperty -Path $key -Name $_ -ErrorAction SilentlyContinue }
          $i = 1
          foreach ($e in $exts) {
            New-ItemProperty -Path $key -Name "$i" -PropertyType String -Force `
              -Value "$e;https://clients2.google.com/service/update2/crx" | Out-Null
            $i++
          }
          Write-Host "--- ExtensionInstallForcelist ---"
          Get-ItemProperty -Path $key | Format-List
          exit 0

      - name: Install rclone + restore profile from encrypted backup
        env:
          RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG }}
        run: |
          # Static rclone binary (no package manager round-trip).
          Invoke-WebRequest -Uri 'https://downloads.rclone.org/rclone-current-windows-amd64.zip' -OutFile "$env:TEMP\rclone.zip"
          Expand-Archive "$env:TEMP\rclone.zip" -DestinationPath "$env:TEMP\rclone" -Force
          $exe = Get-ChildItem "$env:TEMP\rclone" -Recurse -Filter rclone.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path 'C:\rclone' | Out-Null
          Copy-Item $exe.FullName 'C:\rclone\rclone.exe' -Force
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\rclone'
          & 'C:\rclone\rclone.exe' version | Select-Object -First 1

          New-Item -ItemType Directory -Force -Path "$env:APPDATA\rclone" | Out-Null
          Set-Content -Path "$env:APPDATA\rclone\rclone.conf" -Value $env:RCLONE_CONFIG_SECRET -NoNewline
          $env:RCLONE_CONFIG = "$env:APPDATA\rclone\rclone.conf"

          $profileDir = "C:\Users\$env:RDP_USER"
          $remotes = & 'C:\rclone\rclone.exe' listremotes 2>$null
          $rc = 0
          if ("$remotes" -match 'crypt1:') {
            Write-Host "Restoring $profileDir from $env:REMOTE ..."
            & 'C:\rclone\rclone.exe' copy "$env:REMOTE/" $profileDir `
              --transfers 16 --checkers 16 --fast-list --stats 30s --stats-one-line `
              --exclude "AppData/Local/Temp/**" `
              --exclude "AppData/Local/Microsoft/Windows/INetCache/**" `
              --exclude "AppData/Local/Microsoft/Windows/WebCache/**" `
              --exclude "AppData/Local/Microsoft/Windows/Explorer/**" `
              --exclude "AppData/Local/Packages/**/LocalCache/**"
            $rc = $LASTEXITCODE
          } else {
            Write-Host "::warning::RCLONE_CONFIG missing or has no 'crypt1' remote — starting with a blank profile"
          }
          # The Chrome profile is captured separately (lock-safe robocopy stage,
          # see windows-snapshot.ps1), so restore it on top of the home profile.
          if ("$(& 'C:\rclone\rclone.exe' lsf crypt1:chrome --max-depth 1 2>$null)") {
            Write-Host "Restoring the Chrome profile from crypt1:chrome ..."
            & 'C:\rclone\rclone.exe' copy 'crypt1:chrome/' `
              "C:\Users\$env:RDP_USER\AppData\Local\Google\Chrome" `
              --transfers 16 --checkers 16 --stats 30s --stats-one-line
            Write-Host "chrome restore exit $LASTEXITCODE"
          } else {
            Write-Host "no Chrome profile in crypt1:chrome yet — starting fresh"
          }
          # rclone exits non-zero for locked/skipped files, which is normal for a
          # live profile — don't fail the run over it.
          if ($rc -ne 0) { Write-Host "::warning::rclone restore finished with warnings (exit $rc)" }
          exit 0

      - name: Claim the hostname (drop any older node with this name)
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
        run: |
          # Tailscale suffixes a name when an older node still holds it, giving
          # cloudpc-win-1, -2, … and breaking the stable URL. Remove any older
          # node with our name first so we always join as the clean hostname.
          if (-not $env:TS_API_KEY) {
            Write-Host "::warning::TS_API_KEY not set — skipping hostname claim (name may get a -1 suffix)"
            exit 0
          }
          try {
            $resp = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:TS_API_KEY" } `
              -Uri 'https://api.tailscale.com/api/v2/tailnet/-/devices'
          } catch { Write-Host "::warning::could not list tailnet devices: $_"; exit 0 }
          $prefix = $env:TS_HOSTNAME
          foreach ($d in $resp.devices) {
            if ($d.name -like "$prefix*") {
              Write-Host "removing older node $($d.name) ($($d.id)) so $prefix is free"
              try {
                Invoke-RestMethod -Method Delete -Headers @{ Authorization = "Bearer $env:TS_API_KEY" } `
                  -Uri "https://api.tailscale.com/api/v2/device/$($d.id)" | Out-Null
              } catch { Write-Host "::warning::could not remove $($d.id)" }
            }
          }
          exit 0

      - name: Bring up Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          if (-not $env:TS_AUTHKEY) {
            Write-Host "::warning::TS_AUTHKEY not set — desktop unreachable via tailnet"
            exit 0
          }
          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile $msi
          Start-Process msiexec.exe -ArgumentList '/i', $msi, '/qn', '/norestart' -Wait
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          # Wait for the Tailscale service to exist and be running.
          for ($i = 0; $i -lt 15; $i++) {
            $svc = Get-Service Tailscale -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -eq 'Running') { break }
            if ($svc) { Start-Service Tailscale -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
          }
          & $ts up "--authkey=$env:TS_AUTHKEY" "--hostname=$env:TS_HOSTNAME" --accept-routes
          # tailscale takes a few seconds to report an address.
          $ip = ""
          for ($i = 0; $i -lt 20 -and -not $ip; $i++) {
            Start-Sleep -Seconds 3
            $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
          }
          if ($ip) {
            Write-Host "::notice::Windows desktop ready at $ip — RDP to $env:TS_HOSTNAME.<your-tailnet>.ts.net:3389 (user $env:RDP_USER)"
          } else {
            Write-Host "::warning::Tailscale did not report an IP — check the tailnet / auth key"
          }
          exit 0

      - name: Run session
        env:
          GH_TOKEN: ${{ secrets.RESTART_PAT }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          & "$env:GITHUB_WORKSPACE/scripts/windows-session.ps1"
          exit 0

      - name: Final backup
        if: always()   # even on failure or cancellation
        continue-on-error: true
        run: |
          & "$env:GITHUB_WORKSPACE/scripts/windows-snapshot.ps1"
          exit 0

      - name: Trigger next session (fallback if the session did not pre-queue one)
        if: '!cancelled()'
        env:
          GH_TOKEN: ${{ secrets.RESTART_PAT }}
        run: |
          if (-not $env:GH_TOKEN) { Write-Host "No RESTART_PAT — chain stops here."; exit 0 }
          $queued = 0
          $out = gh run list --workflow=windows-desktop.yml --status queued --json databaseId --jq 'length' 2>$null
          if ($out) { $queued = [int]$out }
          if ($queued -gt 0) {
            Write-Host "A run is already queued — not adding another."
            exit 0
          }
          gh workflow run windows-desktop.yml --repo $env:GITHUB_REPOSITORY
          Write-Host "Next session queued."
